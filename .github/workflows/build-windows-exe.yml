name: Build Windows EXE

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Package Windows EXE (installer + portable)
        run: npm run dist:win

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Car-Service-Zone-Windows
          path: |
            release/*.exe

      - name: Publish/replace "latest" release with new EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Car Service Zone — أحدث نسخة (Build ${{ github.run_number }})"
          files: release/*.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
